spring.application.name=diabetesprediction

server.port=8080

# MySQL Database Configuration
# Values can be overridden with environment variables so real credentials
# never need to be committed to source control:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/diabetes_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:JBbj56@#}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Allow the static frontend (opened as a file or from another port) to call the API
spring.mvc.cors.allowed-origins=*
